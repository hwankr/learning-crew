<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>러닝 크루</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👟</text></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFB800">
<!-- iOS: 홈 화면에 추가해야 웹 푸시가 가능하다 (iOS 16.4+) -->
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="러닝 크루">
</head>
<body>
<!-- 부팅 스플래시 — 스토어 init(최대 2초)이 도는 동안의 흰 화면 자리. JS·CSS보다 먼저
     떠야 해서 스타일까지 여기 인라인이고, React 첫 render가 #root를 갈아끼우며 걷어 간다. -->
<style>
  .boot { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; background: #FFFFFF; }
  .boot-box { width: 34px; height: 34px; border-radius: 9px; background: #FFB800;
    animation: boot-pulse 1.2s ease-in-out infinite; }
  @keyframes boot-pulse { 50% { transform: scale(0.84); opacity: 0.65; } }
  .boot-name { font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    font-size: 13px; font-weight: 700; color: #9AA1AD; letter-spacing: -0.01em; }
  @media (prefers-reduced-motion: reduce) { .boot-box { animation: none; } }
</style>
<div id="root"><div class="boot"><div class="boot-box"></div><div class="boot-name">러닝 크루</div></div></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
